<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>註冊 | 人力資料庫</title>
<link rel="stylesheet" href="/css/style.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>建立新帳號</h1>
      <p class="subtitle">註冊後即可管理人力資料庫</p>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" />

      <label for="password">密碼（至少 6 碼）</label>
      <input type="password" id="password" placeholder="請設定密碼" />

      <label for="password2">確認密碼</label>
      <input type="password" id="password2" placeholder="再輸入一次密碼" />

      <button id="registerBtn">註冊</button>

      <div id="msg" class="msg"></div>

      <div class="switch-link">
        已經有帳號了？<a href="/login.html">前往登入</a>
      </div>
    </div>
  </div>

  <script src="/js/firebase-client-config.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
