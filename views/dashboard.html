<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>人力資料庫</title>
<link rel="stylesheet" href="/css/style.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="topbar">
    <h1>👥 人力資料庫管理系統</h1>
    <div class="user-info">
      <span id="userEmail"></span>
      <button id="logoutBtn">登出</button>
    </div>
  </div>

  <div class="container">

    <div class="panel">
      <h2>匯入資料（上傳 .xls / .xlsx）</h2>
      <p style="font-size:13px;color:#6b7280;margin-top:-6px;">
        第一列標題請包含：員工編號、姓名、部門、職稱、到職日、Email、電話、薪資、狀態
      </p>
      <div class="toolbar">
        <input type="file" id="fileInput" accept=".xls,.xlsx" />
        <button class="btn btn-primary" id="importBtn">上傳並匯入</button>
      </div>
      <div id="importMsg" class="msg"></div>
    </div>

    <div class="panel">
      <h2>資料匯出</h2>
      <div class="toolbar">
        <button class="btn btn-green" id="exportXlsxBtn">匯出 Excel (.xlsx)</button>
        <button class="btn btn-green" id="exportDocxBtn">匯出 Word (.docx)</button>
        <button class="btn btn-gray" id="refreshBtn">重新整理列表</button>
      </div>
    </div>

    <div class="panel">
      <h2>員工資料列表 <span id="countLabel" style="color:#6b7280;font-weight:400;font-size:13px;"></span></h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>員工編號</th><th>姓名</th><th>部門</th><th>職稱</th>
              <th>到職日</th><th>Email</th><th>電話</th><th>薪資</th><th>狀態</th><th></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyHint" class="empty-hint" style="display:none;">尚無資料，請先匯入</div>
      </div>
    </div>

  </div>

  <script src="/js/firebase-client-config.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
